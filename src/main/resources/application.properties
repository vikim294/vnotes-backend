spring.application.name=vnotes

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-none} requestId=%X{requestId:-none}] %logger{36} - %msg%n

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:vnotes}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:30m}

file.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

resend.api-key=${RESEND_API_KEY}

oauth.login-url=${OAUTH_LOGIN_URL}
oauth.google-client-id=2503486160-6l25pqddmdqsej6cum4jg1d9p3jbidjq.apps.googleusercontent.com
oauth.google-client-secret=${OAUTH_GOOGLE_CLIENT_SECRET}
oauth.google-redirect-uri=${OAUTH_GOOGLE_REDIRECT_URI}

app.cos.secret-id=${COS_SECRET_ID}
app.cos.secret-key=${COS_SECRET_KEY}
app.cos.bucket=${COS_BUCKET}
app.cos.region=${COS_REGION}
