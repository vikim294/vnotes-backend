name: Deploy - Legacy docker

#on:
#  # 自动触发
#  push:
#    branches:
#      - main

on:
  # 改为手动触发
  workflow_dispatch:

# 避免 Legacy docker 和灰度部署流程 同时进行，同时修改 app 镜像
concurrency:
  group: deployment
  cancel-in-progress: false

# push 镜像到 ghcr 需要 permissions
permissions:
  contents: read
  packages: write

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:
      # GitHub runner 拉代码
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 跳过测试，打 jar
      - name: skip test and package
        run: |
          ./mvnw clean package -DskipTests

      # 登录 ghcr
      - name: Log in to github container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 根据 dockerfile + jar 构建 image（latest 用于上线、github.sha 用于方便回滚）
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/vnotes:latest \
            -t ghcr.io/${{ github.repository_owner }}/vnotes:${{ github.sha }} \
            .

      # push 镜像到 ghcr
      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/vnotes:latest
          docker push ghcr.io/${{ github.repository_owner }}/vnotes:${{ github.sha }}

      # ssh 到 vps
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            
            cd /opt/vnotes
  
            IMAGE_TAG="${{ github.sha }}"
            
            # 更新 .env 中的 APP_IMAGE_TAG 环境变量
            if grep -q '^APP_IMAGE_TAG=' .env; then
              # 存在则替换
              sed -i "s|^APP_IMAGE_TAG=.*$|APP_IMAGE_TAG=${IMAGE_TAG}|" .env
            else
              # 不存在则添加
              printf 'APP_IMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env
            fi
            
            export APP_IMAGE_TAG="$IMAGE_TAG"
            
            docker compose pull app
            docker compose up -d app
            
            deploy_ok=false

            for attempt in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:8080/health; then
                echo "Health check passed"
                deploy_ok=true
                break
              fi

              echo "Waiting for application: ${attempt}/12"
              sleep 10
            done

            # failed
            if [ "$deploy_ok" != "true" ]; then
              echo "Vnotes failed to become healthy..."
              docker compose logs --tail=100 app
              exit 1
            fi

#            # 删除超过 7 天，并且未被任何容器使用的镜像
#            docker image prune -a -f --filter "until=168h"
#
#            # 打印清理后的 Docker 磁盘占用
#            docker system df