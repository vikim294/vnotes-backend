name: build and upload docker image

on:
  # 自动触发
  push:
    branches:
      - main

concurrency:
  group: build-and-upload-docker-image
  # 新的 push 的 workflow 会导致旧 workflow 取消
  cancel-in-progress: true

# push 镜像到 ghcr 需要 permissions
permissions:
  contents: read
  packages: write

jobs:

  build-and-upload-image:

    runs-on: ubuntu-latest

    steps:
      # GitHub runner 拉代码
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 跳过测试，打 jar
      - name: skip test and package
        run: |
          ./mvnw clean package -DskipTests

      # 登录 ghcr
      - name: Log in to github container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 根据 dockerfile + jar 构建 image
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/vnotes:${{ github.sha }} \
            .

      # push 镜像到 ghcr
      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/vnotes:${{ github.sha }}
