name: Deploy Image & Tag Stable

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image SHA tag"
        required: true
        # 提供 input 输入框
        type: string

# 避免和灰度部署流程 同时进行，同时修改 app 镜像
concurrency:
  group: deployment
  # 排队运行
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:

  deploy-and-tag-stable:

    runs-on: ubuntu-latest

    steps:
      # 登录 ghcr
      - name: Log in to github container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check image exists
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_tag must be a 40-character Git SHA"
            exit 1
          fi
      
          docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository_owner }}/vnotes:${IMAGE_TAG}" \
            >/dev/null

      # ssh 到 vps
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            # 下面的 deploy-image-and-tag-stable.sh 失败时，立即终止后续的清理、tag stable 操作
            set -euo pipefail

            /opt/vnotes/deploy-image-and-tag-stable.sh "${IMAGE_TAG}"

            # 删除超过 7 天，并且未被任何容器使用的镜像
            docker image prune -a -f --filter "until=168h" || true

            # 打印清理后的 Docker 磁盘占用
            docker system df || true

      - name: Tag deployed image as stable
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          
          docker buildx imagetools create \
            --prefer-index=false \
            -t "ghcr.io/${{ github.repository_owner }}/vnotes:stable" \
            "ghcr.io/${{ github.repository_owner }}/vnotes:${IMAGE_TAG}"
